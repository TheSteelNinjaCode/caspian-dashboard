<div class="flex min-h-svh w-full items-center justify-center p-6 md:p-10">
  <div class="w-full max-w-sm">
    <div class="flex flex-col gap-6">
      <x-card>
        <x-card-header>
          <x-card-title>Login to your account</x-card-title>
          <x-card-description>
            Enter your email below to login to your account
            <p class="text-red-500">{requestError}</p>
          </x-card-description>
        </x-card-header>
        <x-card-content>
          <form onsubmit="handleSignin(event)">
            <x-field-group>
              <x-field>
                <x-field-label htmlFor="email">Email</x-field-label>
                <x-input name="email"
                         id="email"
                         type="email"
                         placeholder="m@example.com"
                         required />
              </x-field>
              <x-field>
                <div class="flex items-center">
                  <x-field-label htmlFor="password">Password</x-field-label>
                  <a href="#"
                     class="ml-auto inline-block text-sm underline-offset-4 hover:underline">
                    Forgot your password?
                  </a>
                </div>
                <x-input name="password"
                         id="password"
                         type="password"
                         required
                         placeholder="password" />
              </x-field>
              <x-field>
                <x-button type="submit"
                          disabled={loading}>{loading ? "Loading..." : "Login"}</x-button>
                <x-button variant="outline"
                          type="button"
                          disabled={loading}>
                  Login with Google
                </x-button>
                <x-field-description class="text-center">
                  Don&apos;t have an account? <a href="#">Sign up</a>
                </x-field-description>
              </x-field>
            </x-field-group>
          </form>
        </x-card-content>
      </x-card>
    </div>
  </div>

  <script>
    const [requestError, setRequestError] = pp.state(null);
    const [loading, setLoading] = pp.state(false);

    async function handleSignin(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      setLoading(true);
      const response = await pp.rpc("signin", data);

      if (!response.success) {
        setRequestError(response.message);
      } else {
        setRequestError(null);
      }

      setLoading(false);
    }
  </script>
</div>
