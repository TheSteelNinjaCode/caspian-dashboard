<div class="space-y-4">
  <h1 class="text-2xl font-semibold tracking-tight">Profile</h1>
  <p class="text-sm text-muted-foreground">Manage your account details and session preferences.</p>

  <div class="rounded-lg border border-border bg-card p-4">
    <p class="text-sm font-medium text-foreground">Name</p>
    <p class="mt-1 text-sm text-muted-foreground">{{ auth.user.name if auth and auth.user and auth.user.name else "User" }}</p>

    <p class="mt-4 text-sm font-medium text-foreground">Email</p>
    <p class="mt-1 text-sm text-muted-foreground">{{ auth.user.email if auth and auth.user and auth.user.email else "user@example.com" }}</p>
  </div>
</div>
