[project]
name = "my-app"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "aiomysql==0.3.2",
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "beautifulsoup4==4.14.3",
    "caspian-utils~=0.3",
    "cuid==0.4",
    "cuid2==2.0.1",
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "nanoid==2.0.0",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.29",
    "python-ulid==3.1.0",
    "slowapi==0.1.9",
    "starsessions==2.2.1",
    "uvicorn==0.47.0",
    "werkzeug==3.1.8",
]

[tool.uv]
package = false

[tool.pyrefly]
project-includes = ["main.py", "src/**"]
search-path = [".", "src"]
python-platform = "win32"

[tool.pyrefly.errors]
bad-assignment = false
bad-return = false
