<div class="min-h-screen bg-muted/30 text-foreground">
  <div class="flex min-h-screen">
    <aside class="hidden w-72 shrink-0 border-r border-border bg-background p-4 md:flex md:flex-col md:gap-4">
      <div class="flex items-center gap-2 px-2 pt-1">
        <div class="flex size-9 items-center justify-center rounded-md bg-primary/15 text-primary">
          <x-panel-left class="size-4" />
        </div>
        <div>
          <p class="text-xs uppercase tracking-wider text-muted-foreground">Workspace</p>
          <p class="font-semibold">Caspian Dashboard</p>
        </div>
      </div>

      <x-separator />

      <nav class="flex flex-col gap-1">
        <a href="." class="rounded-md bg-primary/10 px-3 py-2 text-sm font-medium text-primary">Overview</a>
        <a href="#" class="rounded-md px-3 py-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground">Analytics</a>
        <a href="#" class="rounded-md px-3 py-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground">Orders</a>
        <a href="#" class="rounded-md px-3 py-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground">Customers</a>
        <a href="#" class="rounded-md px-3 py-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground">Settings</a>
      </nav>

      <x-separator />

      <div class="mt-auto rounded-lg border border-border bg-muted/40 p-3">
        <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Team Plan</p>
        <p class="mt-1 text-sm">8 of 12 seats used</p>
        <x-button class="mt-3 w-full" variant="outline" size="sm">Invite Member</x-button>
      </div>
    </aside>

    <section class="flex min-h-screen flex-1 flex-col">
      <header class="sticky top-0 z-20 border-b border-border bg-background/90 px-4 py-3 backdrop-blur md:px-6">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <x-button type="button" variant="ghost" size="icon" class="md:hidden" aria-label="Open sidebar">
              <x-panel-left class="size-4" />
            </x-button>

            <nav class="flex items-center gap-2 text-sm text-muted-foreground" aria-label="Breadcrumb">
              <a href="." class="hover:text-foreground">Dashboard</a>
              <x-chevron-right class="size-3" />
              <span class="font-medium text-foreground">Overview</span>
            </nav>
          </div>

          <div class="flex items-center gap-2">
            <div class="relative hidden sm:block">
              <x-search class="pointer-events-none absolute left-2.5 top-1/2 size-4 -translate-y-1/2 text-muted-foreground" />
              <input
                type="search"
                placeholder="Search..."
                class="h-9 w-56 rounded-md border border-input bg-background pl-9 pr-3 text-sm outline-none transition focus:border-primary"
              />
            </div>
            <x-button variant="outline" size="sm" class="gap-2">
              <x-calendar class="size-4" />
              Jun 2026
            </x-button>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-4 md:p-6" pp-reset-scroll="true">
        <slot />
      </main>
    </section>
  </div>
</div>
