<div class="min-h-screen bg-muted/30 text-foreground">
  <x-sidebar-provider defaultOpen="False">
    <x-sidebar collapsible="icon">
      <x-sidebar-header class="p-3 md:items-center xl:items-start group-data-[collapsible=icon]:items-center">
        <div class="flex w-full items-center gap-2 md:justify-center xl:justify-start group-data-[collapsible=icon]:justify-center">
          <div class="flex size-9 items-center justify-center rounded-md bg-primary/15 text-primary">
            <x-panel-left class="size-4" />
          </div>
          <div class="group-data-[collapsible=icon]:hidden">
          <p class="font-semibold">Caspian Dashboard</p>
        </div>
        </div>
      </x-sidebar-header>

      <x-sidebar-separator />

      <x-sidebar-content>
        <x-sidebar-group>
          <x-sidebar-group-label>Navigation</x-sidebar-group-label>
          <x-sidebar-group-content>
            <x-sidebar-menu>
              <x-sidebar-menu-item>
                <x-sidebar-menu-button
                  isActive="True"
                  tooltip="Overview"
                  class="group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:[&>span]:hidden"
                >
                  <x-circle class="size-4" />
                  <span>Overview</span>
                </x-sidebar-menu-button>
              </x-sidebar-menu-item>

              <x-sidebar-menu-item>
                <x-sidebar-menu-button
                  tooltip="Analytics"
                  class="group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:[&>span]:hidden"
                >
                  <x-check class="size-4" />
                  <span>Analytics</span>
                </x-sidebar-menu-button>
              </x-sidebar-menu-item>

              <x-sidebar-menu-item>
                <x-sidebar-menu-button
                  tooltip="Orders"
                  class="group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:[&>span]:hidden"
                >
                  <x-minus class="size-4" />
                  <span>Orders</span>
                </x-sidebar-menu-button>
              </x-sidebar-menu-item>

              <x-sidebar-menu-item>
                <x-sidebar-menu-button
                  tooltip="Customers"
                  class="group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:[&>span]:hidden"
                >
                  <x-circle class="size-4" />
                  <span>Customers</span>
                </x-sidebar-menu-button>
              </x-sidebar-menu-item>

              <x-sidebar-menu-item>
                <x-sidebar-menu-button
                  tooltip="Settings"
                  class="group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:[&>span]:hidden"
                >
                  <x-ellipsis class="size-4" />
                  <span>Settings</span>
                </x-sidebar-menu-button>
              </x-sidebar-menu-item>
            </x-sidebar-menu>
          </x-sidebar-group-content>
        </x-sidebar-group>
      </x-sidebar-content>

      <x-sidebar-separator />

      <x-sidebar-footer class="group-data-[collapsible=icon]:hidden">
        <div class="rounded-lg border border-border bg-muted/40 p-3">
          <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Team Plan</p>
          <p class="mt-1 text-sm">8 of 12 seats used</p>
          <x-button class="mt-3 w-full" variant="outline" size="sm">Invite Member</x-button>
        </div>
      </x-sidebar-footer>
    </x-sidebar>

    <x-sidebar-inset>
      <header class="sticky top-0 z-20 border-b border-border bg-background/90 px-4 py-3 backdrop-blur md:px-6">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <x-sidebar-trigger />

            <nav class="flex items-center gap-2 text-sm text-muted-foreground" aria-label="Breadcrumb">
              <a href="." class="hover:text-foreground">Dashboard</a>
              <x-chevron-right class="size-3" />
              <span class="font-medium text-foreground">Overview</span>
            </nav>
          </div>

          <div class="flex items-center gap-2">
            <div class="relative hidden sm:block">
              <x-search class="pointer-events-none absolute left-2.5 top-1/2 size-4 -translate-y-1/2 text-muted-foreground" />
              <input
                type="search"
                placeholder="Search..."
                class="h-9 w-56 rounded-md border border-input bg-background pl-9 pr-3 text-sm outline-none transition focus:border-primary"
              />
            </div>
            <x-button variant="outline" size="sm" class="gap-2">
              <x-calendar class="size-4" />
              Jun 2026
            </x-button>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-4 md:p-6" pp-reset-scroll="true">
        <slot />
      </main>
